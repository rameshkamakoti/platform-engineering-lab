apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-api
  namespace: payments

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-api

  template:

    metadata:
      labels:
        app: payment-api

    spec:

      containers:
      - name: payment-api

        image: 777929922779.dkr.ecr.us-east-2.amazonaws.com/payment-api:v1

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"